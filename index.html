<!-- index.html -->
<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>King Kai's Planet 3D — ดาวท่านไคโอ (Full OOP)</title>
  </head>
  <body
    class="relative w-screen h-screen overflow-hidden bg-pink-200 font-sans"
  >
    <!-- 3D WebGL Canvas Container -->
    <div id="app" class="w-full h-full"></div>

    <!-- UI Overlay (pointer-events-none เพื่อไม่ให้บังการหมุน/ซูมกล้อง) -->
    <div
      class="pointer-events-none fixed inset-0 flex flex-col justify-between p-6"
    >
      <!-- ส่วนหัวมุมซ้ายบน: ป้ายข้อมูลดาวท่านไคโอ -->
      <header class="flex items-start justify-between">
        <div
          class="rounded-2xl border-2 border-orange-400/80 bg-white/80 px-5 py-3.5 shadow-lg backdrop-blur-md"
        >
          <div class="flex items-center gap-2.5">
            <span
              class="inline-block h-3.5 w-3.5 rounded-full bg-orange-500 ring-4 ring-orange-200"
            ></span>
            <h1 class="text-lg font-extrabold tracking-wide text-slate-800">
              ดาวท่านไคโอ
              <span class="text-orange-600">(King Kai's Planet)</span>
            </h1>
          </div>
          <p class="mt-1 text-xs font-medium text-slate-600">
            พิกัด: ปรโลก (Other World) • แรงโน้มถ่วง:
            <span class="font-bold text-orange-600">10G (10 เท่าของโลก)</span>
          </p>
        </div>
      </header>

      <!-- ส่วนล่าง: คำแนะนำการควบคุมกล้อง -->
      <footer class="flex justify-center">
        <div
          class="flex items-center gap-4 rounded-full border border-white/60 bg-slate-900/70 px-5 py-2 text-xs font-medium text-white shadow-md backdrop-blur-md"
        >
          <span class="flex items-center gap-1.5">
            <span
              class="rounded bg-white/20 px-1.5 py-0.5 text-[11px] font-bold"
              >คลิกซ้าย + ลาก</span
            >
            หมุนดูรอบดาว
          </span>
          <span class="text-white/40">|</span>
          <span class="flex items-center gap-1.5">
            <span
              class="rounded bg-white/20 px-1.5 py-0.5 text-[11px] font-bold"
              >Scroll</span
            >
            ซูมเข้า-ออก
          </span>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
